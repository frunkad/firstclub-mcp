[project]
name = "firstclub-mcp"
version = "0.1.0"
description = "Unofficial MCP server for the FirstClub grocery app (Bengaluru)"
readme = "README.md"
authors = [
    { name = "Darshan Baid", email = "hey@darshanbaid.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.4",
    "httpx>=0.28.1",
]

[project.scripts]
firstclub-mcp = "firstclub_mcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
